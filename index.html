<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 이모티콘 보내기</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-width:0;background:radial-gradient(circle at 8% 2%,#ffe2ad,transparent 28rem),#fff9f0;color:#3f3643;font:16px/1.5 system-ui,"Malgun Gothic",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.screen{display:none}.screen.on{display:block}.card{margin-top:18px;padding:clamp(20px,5vw,45px);background:#ffffffdf;border-radius:28px;box-shadow:0 14px 34px #5c41461c;text-align:center}h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.2;margin:0 0 10px}h2{font-size:1.35rem;margin:24px 0 10px}button,input{font:inherit}button{border:0;border-radius:16px;min-height:48px;padding:11px 18px;cursor:pointer;font-weight:900;color:#413643;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04)}button:active,.pop{transform:scale(1.06)}.home{background:#fff;border:2px solid #eadfce}.modes,.choices,.stats{display:grid;gap:14px}.modes{grid-template-columns:repeat(2,1fr);margin-top:28px}.mode{min-height:150px;font-size:1.25rem}.mode b,.choice b{display:block;font-size:2.8rem}.teacher{background:#b8e8ff}.student{background:#ffe486}.password{display:none;max-width:420px;margin:22px auto 0;text-align:left;padding:18px;border-radius:18px;background:#fff4d8}.password.show{display:block}input{width:100%;min-height:48px;border:2px solid #dfcfbb;border-radius:13px;padding:10px}.login{width:100%;margin-top:10px;background:#79d9c1}.message{min-height:1.5em;margin:8px 0 0;font-weight:700}.error{color:#b72f4c}.status{margin:16px 0;padding:10px;border-radius:14px;background:#fff1c5;font-weight:700}.connected{background:#ddf7ea;color:#196149}.problem{background:#ffe1e6;color:#a32948}.choices{grid-template-columns:repeat(3,1fr)}.choice{min-height:125px;font-size:1.1rem}.like{background:#bae7ff}.heart{background:#ffc9d7}.clap{background:#ffe699}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:14px 7px;border:1px solid #f0e2cf;border-radius:17px;background:#fff9ef}.stat strong{display:block;font-size:clamp(1.4rem,4vw,2.1rem)}.total{padding:18px;margin:22px 0 0;border-radius:18px;background:#e9f8f5;font-size:1.3rem;font-weight:900}.feed{display:flex;flex-wrap:wrap;gap:10px;min-height:76px;padding:14px;border:1px dashed #dfcbb1;border-radius:18px;text-align:left}.bubble{width:52px;height:52px;display:grid;place-items:center;background:#fff;border-radius:50%;font-size:2rem;animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(14px) scale(.5)}to{opacity:1;transform:none}}.note{font-size:.92rem;color:#6d6267}@media(max-width:560px){.modes,.choices{grid-template-columns:1fr}.mode{min-height:105px}.choice{min-height:76px}.choice b{display:inline;margin-right:10px;font-size:2.2rem}.stats{gap:7px}.card{padding:22px 15px}}
</style></head><body><main class="wrap"><div class="top"><b>✨ 실시간 이모티콘 교실</b><button id="home" class="home" hidden>처음으로</button></div>
<section id="start" class="screen on"><div class="card"><h1>반응으로 함께하는 수업</h1><p>나의 마음을 이모티콘으로 바로 보내 보세요.</p><div class="modes"><button id="teacher" class="mode teacher"><b>🧑‍🏫</b>강사 모드</button><button id="student" class="mode student"><b>🧑‍🎓</b>학생 모드</button></div><div id="passwordBox" class="password"><label for="password">강사 비밀번호</label><input id="password" type="password" inputmode="numeric" autocomplete="off"><button id="login" class="login">강사 화면으로 들어가기</button><p id="passwordMsg" class="message error" aria-live="polite"></p></div><p class="note">비밀번호 1004는 실습용 화면 진입 제한이며 실제 데이터 보안을 보장하지 않습니다.</p></div></section>
<section id="studentScreen" class="screen"><div class="card"><h1>지금 내 반응을 보내요!</h1><p id="studentStatus" class="status">Firebase에 연결하는 중이에요…</p><div class="choices"><button class="choice like" data-type="like"><b>👍</b>좋아요</button><button class="choice heart" data-type="heart"><b>❤️</b>공감해요</button><button class="choice clap" data-type="clap"><b>👏</b>응원해요</button></div><h2>우리 반의 실시간 반응</h2><div class="stats"><div class="stat">👍 좋아요<strong id="like">0</strong></div><div class="stat">❤️ 공감해요<strong id="heart">0</strong></div><div class="stat">👏 응원해요<strong id="clap">0</strong></div></div><p class="total">지금까지 반응 <span id="total">0</span>회</p></div></section>
<section id="teacherScreen" class="screen"><div class="card"><h1>우리 반 실시간 반응</h1><p id="teacherStatus" class="status">Firebase에 연결하는 중이에요…</p><div class="stats"><div class="stat">👍 좋아요<strong id="tLike">0</strong></div><div class="stat">❤️ 공감해요<strong id="tHeart">0</strong></div><div class="stat">👏 응원해요<strong id="tClap">0</strong></div></div><p class="total">지금까지 반응 <span id="tTotal">0</span>회</p><h2>방금 도착한 반응</h2><div id="feed" class="feed">아직 도착한 반응이 없어요.</div></div></section></main>
<script>
const firebaseConfig={apiKey:"AIzaSyCjXIp97vETcinezdVA_Xc82kddAVQ92Bk",authDomain:"test-f142c.firebaseapp.com",databaseURL:"https://test-f142c-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"test-f142c",storageBucket:"test-f142c.firebasestorage.app",messagingSenderId:"979735149680",appId:"1:979735149680:web:58ab16c143bc1abebc08b5"};
const db=firebase.initializeApp(firebaseConfig).database(),ref=db.ref('practice/reactions'),icons={like:'👍',heart:'❤️',clap:'👏'};let started=false;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));home.hidden=id==='start';if(id==='start'){password.value='';passwordBox.classList.remove('show');passwordMsg.textContent=''}}
teacher.onclick=()=>{passwordBox.classList.add('show');password.focus()};student.onclick=()=>show('studentScreen');home.onclick=()=>show('start');function login(){if(password.value==='1004')show('teacherScreen');else{passwordMsg.textContent='비밀번호가 맞지 않아요. 다시 입력해 주세요.';password.focus()}}document.getElementById('login').onclick=login;password.onkeydown=e=>{if(e.key==='Enter')login()};
function state(text,cls){['studentStatus','teacherStatus'].forEach(id=>{const x=document.getElementById(id);x.textContent=text;x.className='status '+cls})}db.ref('.info/connected').on('value',s=>state(s.val()?'Firebase에 연결되었어요.':'Firebase 연결이 끊어졌어요. 인터넷을 확인해 주세요.',s.val()?'connected':'problem'));
ref.on('value',s=>{const c={like:0,heart:0,clap:0};Object.values(s.val()||{}).forEach(x=>{if(x&&x.type in c)c[x.type]++});const n=c.like+c.heart+c.clap;like.textContent=c.like;heart.textContent=c.heart;clap.textContent=c.clap;tLike.textContent=c.like;tHeart.textContent=c.heart;tClap.textContent=c.clap;total.textContent=n;tTotal.textContent=n},()=>state('반응을 불러오지 못했어요. Firebase 설정과 보안 규칙을 확인해 주세요.','problem'));
ref.limitToLast(30).on('child_added',s=>{const x=s.val();if(!x||!icons[x.type])return;const f=feed;if(!started){f.textContent='';started=true}const b=document.createElement('span');b.className='bubble';b.textContent=icons[x.type];f.append(b);while(f.children.length>30)f.removeChild(f.firstChild)},()=>state('새 반응을 받지 못했어요. Firebase 연결을 확인해 주세요.','problem'));
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=async()=>{b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');b.disabled=true;try{await ref.push({type:b.dataset.type,createdAt:firebase.database.ServerValue.TIMESTAMP});state('반응을 성공적으로 보냈어요!','connected')}catch(e){state('반응 전송에 실패했어요. 인터넷 연결과 Firebase 보안 규칙을 확인해 주세요.','problem')}finally{b.disabled=false}});
</script></body></html>
